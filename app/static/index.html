<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт оплат</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --text: #1c2330; --muted: #667085; --border: #e1e4ea;
      --accent: #2563eb; --accent-text: #fff; --danger: #c0392b; --ok: #17794a; --track: #e8eaef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a2b3; --border: #2a303b;
        --accent: #5b8def; --accent-text: #0b1220; --danger: #ff7b6e; --ok: #4cc38a; --track: #2a303b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0 16px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    section, details {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    summary { font-weight: 600; cursor: pointer; min-height: 24px; }
    details[open] summary { margin-bottom: 12px; }

    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    input, select, button {
      display: block; width: 100%; min-height: 48px; margin-top: 4px; padding: 10px 12px;
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
    }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      cursor: pointer; font-weight: 600; margin-top: 0;
      background: var(--accent); color: var(--accent-text); border-color: transparent;
    }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary { background: transparent; color: var(--accent); border-color: var(--accent); margin-top: 12px; }

    .toolbar { display: flex; gap: 12px; align-items: end; }
    .toolbar label { flex: 1; margin: 0; }
    #summary { margin: 12px 0 0; font-weight: 600; }
    #summary.ok { color: var(--ok); }
    #debtors { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
    .debtor { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .name { font-weight: 600; }
    .debt { font-weight: 700; color: var(--danger); white-space: nowrap; }
    .meta { font-size: 14px; color: var(--muted); }
    .meta a { color: var(--accent); white-space: nowrap; }
    .bar { height: 6px; background: var(--track); border-radius: 3px; margin: 10px 0 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--ok); }

    #msg {
      position: sticky; bottom: 12px; padding: 12px 16px; border-radius: 10px; font-weight: 600;
      background: var(--ok); color: #fff;
    }
    #msg.err { background: var(--danger); }
    #msg[hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Учёт оплат</h1>

  <section>
    <h2>Должники</h2>
    <div class="toolbar">
      <label>Месяц
        <input id="month" type="month" required>
      </label>
    </div>
    <p id="summary" aria-live="polite">Загрузка…</p>
    <ul id="debtors"></ul>
  </section>

  <section id="pay-section">
    <h2>Добавить оплату</h2>
    <form id="payment-form">
      <label>Ученик
        <select id="pay-student" required></select>
      </label>
      <label>Сумма
        <input id="pay-amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="500000">
      </label>
      <label>Дата
        <input id="pay-date" type="date" required>
      </label>
      <button type="submit">Сохранить оплату</button>
    </form>
  </section>

  <details>
    <summary>Новый ученик</summary>
    <form id="student-form">
      <label>Имя
        <input id="st-name" required maxlength="100" autocomplete="off">
      </label>
      <label>Телефон
        <input id="st-phone" type="tel" required placeholder="+998 90 123 45 67"
               pattern="\+?[\d\s()\-]{7,20}" title="От 7 до 20 символов: цифры, пробелы, скобки, дефис, можно + в начале">
      </label>
      <label>Группа
        <input id="st-group" required maxlength="50" autocomplete="off">
      </label>
      <label>Сумма в месяц
        <input id="st-fee" type="number" inputmode="numeric" min="1" step="1" required>
      </label>
      <button type="submit">Добавить ученика</button>
    </form>
  </details>

  <div id="msg" role="status" hidden></div>
</main>

<script>
  const CURRENCY = "сум";

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => new Intl.NumberFormat("ru-RU").format(n);
  const todayISO = () => new Date().toLocaleDateString("sv-SE"); // local date as YYYY-MM-DD

  // Build DOM with textContent only -- names and phones come from users, never use innerHTML.
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
    if (!res.ok) {
      let message = `Ошибка ${res.status}`;
      try {
        const { detail } = await res.json();
        message = Array.isArray(detail)
          ? detail.map((d) => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("; ")
          : detail || message;
      } catch { /* response had no JSON body */ }
      throw new Error(message);
    }
    return res.status === 204 ? null : res.json();
  }

  let msgTimer;
  function flash(text, isError = false) {
    const msg = $("msg");
    msg.textContent = text;
    msg.className = isError ? "err" : "";
    msg.hidden = false;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => (msg.hidden = true), 5000);
  }

  function debtorCard(d) {
    const pct = Math.min(100, Math.round((d.paid / d.monthly_fee) * 100));
    const phoneLink = el("a", { href: "tel:" + d.phone.replace(/[^\d+]/g, ""), textContent: d.phone });
    return el("li", { className: "debtor" },
      el("div", { className: "row" },
        el("div", {},
          el("div", { className: "name", textContent: d.name }),
          el("div", { className: "meta" }, `${d.group} · `, phoneLink)),
        el("div", { className: "debt", textContent: `${fmt(d.debt)} ${CURRENCY}` })),
      el("div", { className: "bar" }, el("span", { style: `width:${pct}%` })),
      el("div", { className: "meta", textContent: `Оплачено ${fmt(d.paid)} из ${fmt(d.monthly_fee)} ${CURRENCY}` }),
      el("button", {
        type: "button", className: "secondary", textContent: "Принять оплату",
        onclick: () => prefillPayment(d),
      }));
  }

  function prefillPayment(d) {
    $("pay-student").value = d.student_id;
    $("pay-amount").value = d.debt;
    $("pay-section").scrollIntoView({ behavior: "smooth", block: "start" });
    $("pay-amount").focus({ preventScroll: true });
  }

  async function loadDebtors() {
    const summary = $("summary");
    try {
      const data = await api(`/debtors?month=${encodeURIComponent($("month").value)}`);
      summary.className = data.count ? "" : "ok";
      summary.textContent = data.count
        ? `Должников: ${data.count} · общий долг ${fmt(data.total_debt)} ${CURRENCY}`
        : "За этот месяц должников нет";
      $("debtors").replaceChildren(...data.debtors.map(debtorCard));
    } catch (err) {
      summary.className = "";
      summary.textContent = "Не удалось загрузить: " + err.message;
      $("debtors").replaceChildren();
    }
  }

  async function loadStudents() {
    const select = $("pay-student");
    const previous = select.value;
    try {
      const students = await api("/students");
      select.replaceChildren(
        ...(students.length
          ? students.map((s) => new Option(`${s.name} — ${s.group}`, s.id))
          : [new Option("Сначала добавьте ученика", "")]));
      if (previous) select.value = previous;
    } catch (err) {
      flash("Не удалось загрузить учеников: " + err.message, true);
    }
  }

  // Disable the submit button while the request is in flight so a double tap doesn't send twice.
  async function submitting(form, action) {
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      await action();
    } catch (err) {
      flash(err.message, true);
    } finally {
      button.disabled = false;
    }
  }

  $("payment-form").addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(e.target, async () => {
      const payment = await api("/payments", {
        method: "POST",
        body: JSON.stringify({
          student_id: Number($("pay-student").value),
          amount: Number($("pay-amount").value),
          date: $("pay-date").value,
        }),
      });
      $("pay-amount").value = "";
      flash(`Оплата ${fmt(payment.amount)} ${CURRENCY} сохранена`);
      await loadDebtors();
    });
  });

  $("student-form").addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(e.target, async () => {
      const student = await api("/students", {
        method: "POST",
        body: JSON.stringify({
          name: $("st-name").value,
          phone: $("st-phone").value,
          group: $("st-group").value,
          monthly_fee: Number($("st-fee").value),
        }),
      });
      e.target.reset();
      flash(`Ученик «${student.name}» добавлен`);
      await Promise.all([loadStudents(), loadDebtors()]);
    });
  });

  $("month").addEventListener("change", loadDebtors);

  $("month").value = todayISO().slice(0, 7);
  $("pay-date").value = todayISO();
  loadStudents();
  loadDebtors();
</script>
</body>
</html>
