<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fa">
  <title>Учёт оплат</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232457e6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the wrong one.
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage unavailable: follow the system theme */ }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="container">
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h12v3"/><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="16.5" cy="14" r="1.1" fill="currentColor"/></svg>
      </span>
      <div>
        <h1>Учёт оплат</h1>
        <p class="subtitle">Учебный центр</p>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn theme-toggle" type="button">
      <span class="icon icon-moon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      <span class="icon icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
    </button>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="debtors-title">
      <div class="panel-head">
        <h2 id="debtors-title">Должники</h2>
        <div class="month-nav" role="group" aria-label="Месяц">
          <button id="month-prev" class="icon-btn" type="button" aria-label="Предыдущий месяц">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
          </button>
          <span id="month-label" class="month-label"></span>
          <button id="month-next" class="icon-btn" type="button" aria-label="Следующий месяц">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
        </div>
      </div>

      <div id="stats" class="stats is-pending">
        <div class="stat">
          <span class="stat-label">Должников</span>
          <span id="stat-count" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Общий долг</span>
          <span id="stat-total" class="stat-value">—</span>
        </div>
      </div>
      <p id="summary" class="sr-only" aria-live="polite"></p>

      <ul id="debtors" class="debtors"></ul>
      <div id="empty" class="empty" hidden></div>
    </section>

    <div class="side">
      <section id="pay-section" class="panel" aria-labelledby="pay-title">
        <div class="panel-head"><h2 id="pay-title">Добавить оплату</h2></div>
        <form id="payment-form">
          <label class="field">
            <span class="field-label">Ученик</span>
            <span class="control is-select"><select id="pay-student" required></select></span>
          </label>
          <label class="field">
            <span class="field-label">Сумма</span>
            <span class="control has-suffix">
              <input id="pay-amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="500000">
              <span class="suffix" data-currency></span>
            </span>
          </label>
          <label class="field">
            <span class="field-label">Дата</span>
            <input id="pay-date" type="date" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Сохранить оплату</button>
        </form>
      </section>

      <details id="student-details" class="panel">
        <summary>
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 20a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg></span>
          Новый ученик
          <span class="icon chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </summary>
        <form id="student-form">
          <label class="field">
            <span class="field-label">Имя</span>
            <input id="st-name" required maxlength="100" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label">Телефон</span>
            <input id="st-phone" type="tel" required placeholder="+998 90 123 45 67"
                   pattern="\+?[\d\s\(\)\-]{7,20}" title="От 7 до 20 символов: цифры, пробелы, скобки, дефис, можно + в начале">
          </label>
          <label class="field">
            <span class="field-label">Группа</span>
            <input id="st-group" required maxlength="50" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label">Сумма в месяц</span>
            <span class="control has-suffix">
              <input id="st-fee" type="number" inputmode="numeric" min="1" step="1" required>
              <span class="suffix" data-currency></span>
            </span>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Добавить ученика</button>
        </form>
      </details>
    </div>
  </main>
</div>

<div id="msg" hidden></div>
</body>
</html>
